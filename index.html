<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinerSync AI Excel Tap Lab</title><style>:root{--bg:#07101d;--card:#0e1d33;--card2:#13243e;--text:#f8fafc;--muted:#9fb2d0;--line:#2a3a53;--accent:#f59e0b;--good:#22c55e;--bad:#ef4444;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:14px 12px 80px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#081523}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.grid{display:grid;gap:10px}.stats{grid-template-columns:repeat(3,1fr)}@media(max-width:700px){.stats{grid-template-columns:1fr}.btnrow{grid-template-columns:1fr!important}}h1,h2,h3{margin:0 0 8px}.eyebrow{color:var(--accent);font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}button{border:0;border-radius:14px;padding:14px 16px;font-weight:900;background:#1b3356;color:var(--text)}button.primary{background:var(--accent);color:#111}button.good{background:var(--good);color:#05210f}button.bad{background:var(--bad);color:#fff}.btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#07101d;color:var(--text);padding:11px;margin:5px 0 10px}textarea{min-height:130px}.big{font-size:2rem;color:var(--accent);font-weight:1000}.list{display:grid;gap:8px}.item{background:#07101d;border:1px solid var(--line);border-radius:12px;padding:10px}.warn{color:var(--accent)}.ok{color:var(--good)}.badtext{color:#fca5a5}.map{height:360px;position:relative;background:linear-gradient(135deg,#13243e,#07101d);border:1px solid var(--line);border-radius:18px;overflow:hidden}.pin{position:absolute;transform:translate(-50%,-50%);min-width:34px;height:34px;border-radius:999px;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;font-weight:1000;border:2px solid #fff}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:sticky;bottom:0;background:#07101d;padding:8px;border-top:1px solid var(--line)}.tabs button{padding:10px;font-size:.8rem}.active{outline:2px solid var(--accent)}table{width:100%;border-collapse:collapse;font-size:.82rem}td,th{border:1px solid var(--line);padding:6px;text-align:left}th{color:var(--accent)}.small{font-size:.8rem}</style></head><body><div id="app"></div><script>const KEY='linersync_ai_excel_tap_lab_phone_v1';const TYPES=['Panel','Repair','Air Test','DT','Seam','Roll'];const ROPT=[['P','Patch'],['B','Bead'],['DP','Detail Patch']];let state=load();let tab='dash';let pending=null;function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}function seed(){return{project:{name:'Mesquite WWTP Cell F',client:'WEE',site:'Mesquite WWTP',area:'Cell F',material:'60MIL',qcTech:'SL'},logs:[],queue:[],points:[],status:'Ready'}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function id(p='LS'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}function esc(s=''){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function csvEsc(s=''){return '"'+String(s??'').replaceAll('"','""')+'"'}function dl(name,text,type='text/plain'){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function now(){return new Date().toISOString()}function getGps(cb){if(!navigator.geolocation){cb({error:'NO GPS'});return}navigator.geolocation.getCurrentPosition(p=>cb({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,capturedAt:now()}),e=>cb({error:e.message||'GPS denied',capturedAt:now()}),{enableHighAccuracy:true,timeout:12000,maximumAge:5000})}function setTab(t){tab=t;render()}function audit(){let c=0,w=0;state.logs.forEach(l=>{if(l.type==='Repair'&&!l.fields.repairType)c++;if(l.type==='Air Test'){let a=+l.fields.startPsi,b=+l.fields.endPsi;if(a&&b&&a-b>3)c++;if(!l.fields.result)w++}if(l.type==='Panel'&&(!l.fields.panel||!l.fields.roll))c++});return{status:c?'CRITICAL':w?'WARNING':'PASS',critical:c,warning:w}}function quickRepair(rt){getGps(gps=>{pending={id:id('CAP'),type:'Repair',fields:{repairType:rt,verifiedBy:state.project.qcTech||''},notes:'',gps,capturedAt:gps.capturedAt||now()};tab='capture';render()})}function approvePending(){if(!pending)return;const log={...pending,id:id('LOG'),status:'LOCKED',title:pending.fields.repairId||pending.fields.repairType||pending.type};state.logs.unshift(log);if(log.gps&&log.gps.lat)state.points.unshift({id:id('PT'),logId:log.id,type:log.type,label:log.fields.repairType||log.type,gps:log.gps,x:50+Math.random()*20-10,y:50+Math.random()*20-10});pending=null;state.status='Locked record';save();tab='dash';render()}function parsePaste(){const txt=document.getElementById('paste')?.value||'';const rows=txt.split(/\r?\n/).map(r=>r.split('\t').map(c=>c.trim())).filter(r=>r.some(Boolean));if(!rows.length)return;let first=rows[0].join(' ').toUpperCase();let type=document.getElementById('sheetType').value;if(type==='AUTO'){if(first.includes('PANEL'))type='Panel';else if(first.includes('PRESSURE')||first.includes('AIR'))type='Air Test';else if(first.includes('REP')||first.includes('REPAIR'))type='Repair';else if(first.includes('DT')||first.includes('DESTRUCT'))type='DT';else if(first.includes('SEAM'))type='Seam';else type='Panel'}let start=rows[0].some(c=>/DATE|PANEL|SEAM|REP|ROLL/i.test(c))?1:0;let added=0;for(let i=start;i<rows.length;i++){let r=rows[i];if(!r.some(Boolean))continue;let rec={id:id('Q'),type,status:'REVIEW',title:'',fields:{},notes:'Imported from Excel paste',capturedAt:now(),warnings:[]};if(type==='Panel'){rec.fields={date:r[0],panel:r[1],roll:r[2],panelWidth:r[3],panelLength:r[4],comments:r[5],sqFt:r[6]};rec.title=rec.fields.panel||'Panel';if(!rec.fields.panel||!rec.fields.roll)rec.warnings.push('Missing panel or roll')}else if(type==='Repair'){rec.fields={repairId:r[0],seam:r[1],dateRepaired:r[2],repairedBy:r[3],repairType:r[4],leaks:r[5],retest:r[6],dateAccepted:r[7],tester:r[8]};rec.title=rec.fields.repairId||rec.fields.seam||'Repair';if(!rec.fields.repairType)rec.warnings.push('Missing repair type')}else if(type==='Air Test'){rec.fields={date:r[0],seam:r[1],startTime:r[2],startPsi:r[3],endTime:r[4],endPsi:r[5],result:r[6],tester:r[7]};rec.title=rec.fields.seam||'Air Test';let a=+rec.fields.startPsi,b=+rec.fields.endPsi;if(a&&b)rec.fields.pressureDrop=a-b;if(!rec.fields.result)rec.warnings.push('Result blank')}else if(type==='DT'){rec.fields={date:r[0],dtNumber:r[1],welder:r[2],machine:r[3],temp:r[4],speed:r[5],seam:r[6],repairLocation:r[7],result:r[8]};rec.title=rec.fields.dtNumber||'DT'}else if(type==='Seam'){rec.fields={date:r[0],time:r[1],seam:r[2],welder:r[3],machine:r[4],temp:r[5],speed:r[6],comments:r[7]};rec.title=rec.fields.seam||'Seam'}state.queue.unshift(rec);added++}state.status='Parsed '+added+' rows to review queue';save();render()}function accept(idv){let q=state.queue.find(x=>x.id===idv);if(!q)return;state.queue=state.queue.filter(x=>x.id!==idv);state.logs.unshift({...q,id:id('LOG'),status:'LOCKED'});save();render()}function acceptAll(){let qs=[...state.queue];state.queue=[];qs.reverse().forEach(q=>state.logs.unshift({...q,id:id('LOG'),status:'LOCKED'}));save();render()}function reject(idv){state.queue=state.queue.filter(x=>x.id!==idv);save();render()}function del(idv){state.logs=state.logs.filter(x=>x.id!==idv);state.points=state.points.filter(x=>x.logId!==idv);save();render()}function exportJson(){dl((state.project.name||'linersync')+'_backup.json',JSON.stringify(state,null,2),'application/json')}function importJson(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);state.project=j.project||state.project;state.logs=j.logs||[];state.queue=j.queue||[];state.points=j.points||[];state.status='Imported JSON backup';save();render()}catch(e){alert('Import failed '+e.message)}};r.readAsText(f)}function exportCsv(){let h=['type','title','status','capturedAt','fields','notes'];let rows=state.logs.map(l=>[l.type,l.title,l.status,l.capturedAt,JSON.stringify(l.fields),l.notes].map(csvEsc).join(','));dl('linersync_logs.csv',[h.join(','),...rows].join('\n'),'text/csv')}function exportKml(){let k='<?xml version="1.0"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>'+state.points.filter(p=>p.gps&&p.gps.lat).map(p=>`<Placemark><name>${esc(p.label)}</name><Point><coordinates>${p.gps.lng},${p.gps.lat},0</coordinates></Point></Placemark>`).join('')+'</Document></kml>';dl('linersync_map.kml',k,'application/vnd.google-earth.kml+xml')}function exportWorkbook(){let sheets=['<h1>SOUTHWEST LINER SYSTEMS INC.</h1><h2>'+esc(state.project.name)+'</h2>'];['Panel','Repair','Air Test','DT','Seam','Roll'].forEach(t=>{let logs=state.logs.filter(l=>l.type===t);sheets.push('<h2>'+t+'</h2><table><tr><th>Title</th><th>Date</th><th>Fields</th><th>Notes</th></tr>'+logs.map(l=>'<tr><td>'+esc(l.title)+'</td><td>'+esc(l.capturedAt)+'</td><td>'+esc(JSON.stringify(l.fields))+'</td><td>'+esc(l.notes)+'</td></tr>').join('')+'</table>')});dl('linersync_workbook.html','<html><body>'+sheets.join('<hr>')+'</body></html>','text/html')}function pageDash(){let a=audit();return `<div class="card"><p class="eyebrow">Project</p><h2>${esc(state.project.name)}</h2><p class="muted">${esc(state.project.client)} · ${esc(state.project.site)} · ${esc(state.project.area)} · ${esc(state.project.material)}</p></div><div class="grid stats"><div class="card">Total Logs <span class="big">${state.logs.length}</span></div><div class="card">Review Queue <span class="big">${state.queue.length}</span></div><div class="card">Repairs <span class="big">${state.logs.filter(l=>l.type==='Repair').length}</span></div></div><div class="card"><p class="eyebrow">Audit</p><h2 class="${a.status==='PASS'?'ok':a.status==='WARNING'?'warn':'badtext'}">${a.status}</h2><p>Critical: ${a.critical} · Warnings: ${a.warning}</p></div><div class="card"><p class="eyebrow">Quick Repair Tap</p><h2>GPS + Time + Patch/Bead/DP</h2><div class="btnrow">${ROPT.map(r=>`<button class="primary" onclick="quickRepair('${r[0]}')">${r[1]}<br><small>${r[0]}</small></button>`).join('')}</div></div>`}function pageCapture(){if(!pending)return pageDash();let f=pending.fields;return `<div class="card"><p class="eyebrow">Repair Capture</p><h2>${esc(f.repairType)}</h2><p class="${pending.gps?.lat?'ok':'warn'}">${pending.gps?.lat?'GPS '+pending.gps.lat.toFixed(6)+', '+pending.gps.lng.toFixed(6):'GPS '+esc(pending.gps?.error)}</p>${['repairId','seam','repairLocation','verifiedBy'].map(k=>`<label>${k}<input value="${esc(f[k]||'')}" oninput="pending.fields['${k}']=this.value;save()"></label>`).join('')}<label>Notes<textarea oninput="pending.notes=this.value;save()">${esc(pending.notes)}</textarea></label><button onclick="pending=null;render()">Cancel</button> <button class="primary" onclick="approvePending()">Approve / Lock</button></div>`}function pageImport(){return `<div class="card"><p class="eyebrow">Excel Driven Import</p><select id="sheetType"><option>AUTO</option>${TYPES.map(t=>`<option>${t}</option>`).join('')}</select><textarea id="paste" placeholder="Paste copied Excel rows here. One sheet at a time."></textarea><button class="primary" onclick="parsePaste()">Parse / Review Import</button></div><div class="card"><p class="eyebrow">Review Queue</p><button onclick="acceptAll()">Accept All</button><div class="list">${state.queue.map(q=>`<div class="item"><b>${esc(q.type)} · ${esc(q.title)}</b><p class="${q.warnings?.length?'warn':'ok'}">${q.warnings?.length?q.warnings.join('; '):'Clean'}</p><pre class="small">${esc(JSON.stringify(q.fields,null,2))}</pre><button class="good" onclick="accept('${q.id}')">Accept</button> <button class="bad" onclick="reject('${q.id}')">Reject</button></div>`).join('')||'<p class="muted">Queue empty</p>'}</div></div>`}function pageLogs(){return `<div class="card"><p class="eyebrow">Logs</p><div class="list">${state.logs.map(l=>`<div class="item"><b>${esc(l.title)} · ${esc(l.type)}</b><p>${esc(l.status)} · ${esc(l.capturedAt||'')}</p><pre class="small">${esc(JSON.stringify(l.fields,null,2))}</pre><button onclick="del('${l.id}')">Delete</button></div>`).join('')||'<p class="muted">No logs yet</p>'}</div></div>`}function pageMap(){return `<div class="card"><p class="eyebrow">As-Built Map</p><p>P=${state.points.filter(p=>p.label==='P').length} B=${state.points.filter(p=>p.label==='B').length} DP=${state.points.filter(p=>p.label==='DP').length}</p><div class="map">${state.points.map(p=>`<div class="pin" style="left:${p.x||50}%;top:${p.y||50}%">${esc(p.label||p.type)}</div>`).join('')}</div></div>`}function pageSettings(){let p=state.project;return `<div class="card"><p class="eyebrow">Project Settings</p>${['name','client','site','area','material','qcTech'].map(k=>`<label>${k}<input value="${esc(p[k]||'')}" oninput="state.project['${k}']=this.value;save()"></label>`).join('')}<button onclick="save();render()">Save</button></div><div class="card"><p class="eyebrow">Backup / Export</p><button onclick="exportJson()">Export JSON Backup</button> <button onclick="exportCsv()">Export CSV</button> <button onclick="exportKml()">Export KML</button> <button onclick="exportWorkbook()">Export Workbook HTML</button><p><input type="file" accept=".json" onchange="importJson(event)"></p></div>`}function render(){document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><div><h1>LinerSync AI Excel Tap Lab</h1><p class="muted">Standalone phone app · original production app untouched</p></div><span class="pill">${esc(state.status)}</span></div>${tab==='dash'?pageDash():tab==='capture'?pageCapture():tab==='import'?pageImport():tab==='logs'?pageLogs():tab==='map'?pageMap():pageSettings()}<div class="tabs">${[['dash','Dash'],['import','Import'],['logs','Logs'],['map','Map'],['settings','Settings']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}render()</script></body></html>
